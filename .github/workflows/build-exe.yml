name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller

      - name: Run offline regression tests
        run: |
          $tests = @("regression_test.py", "test_oknte.py", "test_feedback.py", "test_runtime_log.py", "test_window_state.py", "test_close_prompt.py", "test_daily.py", "test_ui_state.py", "test_tray.py", "test_elevation.py")
          foreach ($test in $tests) {
            python -B "tools/$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build single-file exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name GameHub --icon "assets/hub.ico" --add-data "assets;assets" hub.pyw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-windows-x64
          path: dist/GameHub.exe

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GameHub.exe

name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller

      - name: Build single-file exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name GameHub --icon "assets/hub.ico" --add-data "assets;assets" hub.pyw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-windows-x64
          path: dist/GameHub.exe

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GameHub.exe

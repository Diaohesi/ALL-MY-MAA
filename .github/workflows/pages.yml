name: Deploy GitHub Pages

# 部署仓库 docs/ 目录为 GitHub Pages 站点。
# 首次使用前需在仓库 Settings -> Pages 中把 Source 设为 "GitHub Actions"。

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 仅授予部署 Pages 所需的最小权限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署，排队中的旧任务不取消当前部署。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
